<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charterly · CICES Member (Senior Applicant Route)</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CharteRly</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- Netlify Identity Widget -->
<script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
  /* ── PALETTE
     #9FBBCF  sky blue   → neutral / landing
     #6F597A  purple mid → RICS accent
     #503D5C  deep purple→ RICS primary
     #84B399  sage green → CICES accent
     #2E4D3B  forest     → CICES primary
  ── */
  :root {
    /* App chrome — light, paper-like */
    --bg:       #eef2f5;          /* cool off-white, hint of sky */
    --surface:  #f7f9fb;          /* near-white panels */
    --card:     #ffffff;          /* pure white cards */
    --border:   #cdd8e0;          /* desaturated sky */
    --border2:  #b8c8d4;

    /* Sky / neutral (#9FBBCF) */
    --sky:        #5a8aa4;        /* darkened for legibility on light bg */
    --sky-dim:    #7aa3bb;
    --sky-bg:     #e4edf3;
    --sky-border: #9FBBCF;

    /* RICS purples (#503D5C / #6F597A) */
    --rics:        #503D5C;
    --rics-bright: #6F597A;
    --rics-bg:     #ede9f2;
    --rics-border: #b3a3c0;
    --rics-grd:    linear-gradient(135deg,#503D5C,#6F597A,#503D5C);

    /* CICES greens (#2E4D3B / #84B399) */
    --cices:        #2E4D3B;
    --cices-bright: #4a7a61;
    --cices-bg:     #e4ede8;
    --cices-border: #84B399;
    --cices-grd:    linear-gradient(135deg,#2E4D3B,#84B399,#2E4D3B);

    --green:  #2e7d52;
    --red:    #c0392b;
    --amber:  #b5651d;

    /* Text */
    --text:   #1e2530;            /* near-black with cool tint */
    --muted:  #5a6a7a;
    --faint:  #96aab8;

    /* Default accent = sky blue */
    --accent:     #5a8aa4;
    --accent2:    #3a6e8a;
    --acc-bg:     #e4edf3;
    --acc-border: #9FBBCF;
    --acc-grd:    linear-gradient(135deg,#9FBBCF,#c2d8e8,#9FBBCF);
  }
  body.rics-mode  {
    --accent:     var(--rics);
    --accent2:    var(--rics-bright);
    --acc-bg:     var(--rics-bg);
    --acc-border: var(--rics-border);
    --acc-grd:    var(--rics-grd);
  }
  body.cices-mode {
    --accent:     var(--cices);
    --accent2:    var(--cices-bright);
    --acc-bg:     var(--cices-bg);
    --acc-border: var(--cices-border);
    --acc-grd:    var(--cices-grd);
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.6;min-height:100vh;overflow-x:hidden;transition:background .3s}

  /* HEADER */
  header{position:sticky;top:0;z-index:100;background:rgba(247,249,251,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:58px}
  .logo{display:flex;flex-direction:row;align-items:center;gap:12px}
  .logo img{height:52px;width:auto;display:block}
  .logo-tagline{font-family:'DM Sans',sans-serif;font-size:11px;font-style:italic;color:var(--muted);letter-spacing:.02em;white-space:nowrap}
  .header-right{display:flex;align-items:center;gap:14px}
  .progress-wrap{display:flex;align-items:center;gap:8px}
  .progress-track{background:var(--border);border-radius:20px;width:90px;height:5px;overflow:hidden}
  .progress-fill{height:100%;background:var(--acc-grd);border-radius:20px;transition:width .5s ease;width:0%}
  .progress-label{font-family:'DM Mono',monospace;font-size:11px;color:var(--accent);font-weight:500;min-width:30px}

  /* STEP BAR */
  .stepbar{background:var(--surface);border-bottom:1px solid var(--border);display:flex}
  .step-item{flex:1;text-align:center;padding:12px 6px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border-bottom:2px solid transparent;cursor:default;transition:all .2s;user-select:none}
  .step-item.active{color:var(--accent);border-bottom-color:var(--accent)}
  .step-item.done{color:var(--green);border-bottom-color:var(--green);cursor:pointer}
  .step-item.done:hover{opacity:.8}

  /* Outer wrapper for CPD / Case Study / CV sections — matches r3-centre padding */
  .sec-outer { padding: 28px 28px 80px; min-width: 0; }

  /* MAIN */
  main{max-width:100%;margin:0;padding:0}

  /* PANELS */
  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px 44px;margin-bottom:18px;animation:fadeUp .25s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .panel-info {border-color:var(--sky-border);background:var(--sky-bg)}
  .panel-warn {border-color:#e8b4b8;background:#fdf0f0}
  .panel-rics {border-color:var(--rics-border);background:var(--rics-bg)}
  .panel-acc  {border-color:var(--acc-border);background:var(--acc-bg)}

  h1.page-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:var(--text);margin-bottom:4px}
  h2.section-title{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--text);margin-bottom:4px}
  p.sub{color:var(--muted);font-size:12px;margin-bottom:20px;line-height:1.55}
  p.hint{color:var(--sky);font-size:12px;line-height:1.55}

  /* CHOICE CARDS */
  .choice-grid{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:24px}
  .choice-card{flex:1;min-width:200px;max-width:340px;border:2px solid var(--border);background:var(--surface);border-radius:12px;padding:22px 20px;cursor:pointer;transition:all .18s;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
  /* ── Pathway Guidance card ──────────────────────────────────────── */
  .pathway-card{flex:1;min-width:200px;max-width:300px;border:2px solid #9FBBCF;background:linear-gradient(160deg,#EEF5FA 0%,#dceaf3 100%);border-radius:12px;padding:22px 20px;cursor:pointer;transition:all .18s;position:relative;overflow:hidden;text-align:center;display:flex;flex-direction:column;justify-content:space-between}
  .pathway-card:hover{border-color:#7aa8c4;box-shadow:0 6px 24px rgba(159,187,207,.4);transform:translateY(-2px)}
  .pathway-card .choice-label{font-size:20px;font-weight:700;color:#3a6a8a;margin-bottom:6px;letter-spacing:.01em}
  .pathway-card .choice-desc{font-size:12.5px;color:#4a6070;margin-bottom:14px;line-height:1.5}
  .pathway-card .pg-badge{display:inline-block;font-family:'DM Mono',monospace;background:#9FBBCF;color:#1a3d52;border:1px solid #7fa8c0;border-radius:3px;font-size:10px;font-weight:500;padding:2px 8px;letter-spacing:.05em}
  .choice-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;opacity:0;transition:opacity .2s}
  /* RICS card */
  .rics-card:hover,.rics-card.selected{border-color:var(--rics);background:var(--rics-bg)}
  .rics-card:hover{box-shadow:0 6px 24px rgba(80,61,92,.25);transform:translateY(-2px)}
  .rics-card::before{background:var(--rics-grd)}
  .rics-card:hover::before,.rics-card.selected::before{opacity:1}
  /* CICES card */
  .cices-card:hover,.cices-card.selected{border-color:var(--cices);background:var(--cices-bg)}
  .cices-card:hover{box-shadow:0 6px 24px rgba(46,77,59,.25);transform:translateY(-2px)}
  .cices-card::before{background:var(--cices-grd)}
  .cices-card:hover::before,.cices-card.selected::before{opacity:1}
  /* Generic */
  .choice-card.selected{border-color:var(--accent);background:var(--acc-bg)}
  .choice-card.selected::before{opacity:1;background:var(--acc-grd)}
  .choice-card:hover{border-color:var(--accent)}
  .choice-card.disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
  .choice-label{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;margin-bottom:5px}
  .choice-desc{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.5}

  /* BADGES */
  .badge{display:inline-block;font-family:'DM Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.05em;padding:2px 8px;border-radius:3px}
  .badge-sky  {background:var(--sky-bg);color:var(--sky);border:1px solid var(--sky-border)}
  .badge-rics {background:var(--rics-bg);color:var(--rics-bright);border:1px solid var(--rics-border)}
  .badge-cices{background:var(--cices-bg);color:var(--cices-bright);border:1px solid var(--cices-border)}
  .badge-green{background:var(--cices-bg);color:var(--cices);border:1px solid var(--cices-border)}
  .badge-muted{background:var(--border);color:var(--muted)}
  .badge-acc  {background:var(--acc-bg);color:var(--accent);border:1px solid var(--acc-border)}
  .badge-red  {background:#fdf0f0;color:#c0392b;border:1px solid #e8b4b8}

  /* BUTTONS */
  .btn{display:inline-flex;align-items:center;gap:6px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;padding:10px 22px;border-radius:8px;border:none;cursor:pointer;transition:all .15s;letter-spacing:.02em}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent2);transform:translateY(-1px)}
  .btn-primary:disabled{opacity:.35;cursor:not-allowed;transform:none}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border2)}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn-export{background:var(--cices-bg);color:var(--cices);border:1px solid var(--cices-border);font-size:14px;padding:12px 28px}
  .btn-export:hover{background:var(--cices-border);color:#fff}
  .btn-row{display:flex;gap:10px;margin-top:4px;align-items:center;flex-wrap:wrap}

  /* COMPETENCY ROWS */
  .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
  .comp-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:8px;margin-bottom:5px;border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:all .13s;user-select:none}
  .panel-collapsible .panel-body { transition: max-height .3s ease, opacity .25s ease; overflow: hidden; }
  .panel-collapsible.collapsed .panel-body { max-height: 0 !important; opacity: 0; }
  /* Clickable header row */
  .panel-collapsible .section-header { cursor: pointer; user-select: none; border-radius: 6px; padding: 4px 6px; margin: -4px -6px 5px; transition: background .13s; }
  .panel-collapsible .section-header:hover { background: var(--surface); }
  /* Chevron button */
  .panel-collapse-btn { background: none; border: none; cursor: pointer; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 6px; transition: all .15s; color: var(--muted); flex-shrink: 0; }
  .panel-collapse-btn:hover { background: var(--border); color: var(--text); }
  .panel-collapse-btn svg { transition: transform .25s ease; }
  .panel-collapsible.collapsed .panel-collapse-btn svg { transform: rotate(-90deg); }
  .comp-row:hover:not(.disabled):not(.locked):not(.auto-locked){border-color:var(--accent);background:var(--acc-bg)}
  .comp-row.selected   {border-color:var(--accent);background:var(--acc-bg)}
  .comp-row.disabled   {opacity:.35;cursor:not-allowed}
  .comp-row.locked     {border-color:var(--cices-border);background:var(--cices-bg);cursor:default;opacity:1}
  .comp-row.auto-locked{border-color:var(--rics-border);background:var(--rics-bg);cursor:default;opacity:1}
  .comp-id      {font-family:'DM Mono',monospace;font-size:11px;font-weight:500;color:var(--accent);min-width:42px;flex-shrink:0}
  .comp-name    {flex:1;font-size:13px}
  .comp-conflict{font-size:11px;color:var(--red);flex-shrink:0}
  .comp-limit   {font-size:11px;color:var(--muted);flex-shrink:0}
  .comp-auto    {font-size:11px;color:var(--rics-bright);flex-shrink:0}

  .chk{width:17px;height:17px;border-radius:4px;flex-shrink:0;border:2px solid var(--faint);background:transparent;display:flex;align-items:center;justify-content:center;transition:all .12s}
  .chk.on{border-color:var(--accent);background:var(--accent)}
  .chk.radio{border-radius:50%}
  .chk-lock-g{width:17px;height:17px;border-radius:4px;flex-shrink:0;border:2px solid var(--cices-bright);background:var(--cices-bright);display:flex;align-items:center;justify-content:center}
  .chk-lock-r{width:17px;height:17px;border-radius:50%;flex-shrink:0;border:2px solid var(--rics);background:var(--rics);display:flex;align-items:center;justify-content:center}

  /* MSR toggle */
  .sf3-toggle{display:flex;align-items:center;gap:5px;margin-left:auto}
  .sf3-lbl{font-size:11px;color:var(--muted);margin-right:2px}
  .sf3-btn{font-family:'DM Mono',monospace;font-size:10px;font-weight:600;padding:3px 10px;border-radius:4px;border:none;cursor:pointer;transition:all .15s}
  .sf3-btn.on {background:var(--accent);color:#fff}
  .sf3-btn.off{background:var(--border);color:var(--muted)}
  .sf3-btn.off:hover{background:var(--border2);color:var(--text)}

  /* STATEMENT EDITOR */
  /* ── 3-COLUMN PAGE LAYOUT ── */
  /* Step 0/1/2/4: single centred column */
  .page-centre{max-width:1080px;width:100%;margin:0 auto;padding:48px 40px 80px;box-sizing:border-box}

  /* Step 2: left-glossary | centre panels */
  .r2-layout{
    display:grid;
    grid-template-columns:220px 1fr 272px;
    gap:0;
    align-items:flex-start;
    min-height:calc(100vh - 116px);
  }
  .r2-centre{padding:28px 24px 80px;min-width:0}
  .r2-nav-item:hover { background: var(--surface) !important; border-color: var(--border) !important; }
  .r2-nav-active:hover { background: var(--acc-bg) !important; border-color: var(--acc-border) !important; }
  .r2-glossary{
    position:sticky;top:58px;
    height:calc(100vh - 58px);
    overflow-y:auto;
    border-left:1px solid var(--border);
    padding:16px 14px 24px;
    background:var(--surface);
    scrollbar-width:thin;
    scrollbar-color:var(--rics-border) transparent;
  }

  /* Step 3: left-nav | centre editor | right-glossary */
  .r3-layout{
    display:grid;
    grid-template-columns:220px 1fr 272px;
    gap:0;
    align-items:flex-start;
    min-height:calc(100vh - 116px);
  }

  /* Left nav sidebar (step 3) */
  .sidebar{
    position:sticky;top:58px;
    height:calc(100vh - 58px);
    overflow-y:auto;
    border-right:1px solid var(--border);
    padding:16px 12px 24px;
    background:var(--surface);
    scrollbar-width:thin;
    scrollbar-color:var(--border) transparent;
    flex-shrink:0;
  }
  .sidebar-cat{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:5px;margin-top:14px;padding-left:6px}
  .sidebar-cat:first-child{margin-top:0}
  .sidebar-item{display:flex;align-items:flex-start;gap:7px;padding:8px 10px;border-radius:6px;margin-bottom:3px;cursor:pointer;font-size:12px;color:var(--muted);border:1px solid transparent;transition:all .12s}
  .sidebar-item:hover{color:var(--text);background:var(--card)}
  .sidebar-item.active{color:var(--accent);background:var(--acc-bg);border-color:var(--acc-border)}

  /* Centre editor column (step 3) */
  .r3-centre{padding:28px 28px 80px;min-width:0;overflow:hidden}

  /* Right glossary column (shared step 2 & 3) */
  .r3-glossary{
    position:sticky;top:58px;
    height:calc(100vh - 58px);
    overflow-y:auto;
    border-left:1px solid var(--border);
    padding:16px 14px 24px;
    background:var(--surface);
    scrollbar-width:thin;
    scrollbar-color:var(--rics-border) transparent;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex-shrink:0;transition:background .2s;margin-top:5px}
  .dot.done{background:var(--green)}

  .editor-main{flex:1;min-width:0}
  .editor-empty{text-align:center;padding:56px 24px;background:var(--card);border:1px solid var(--border);border-radius:14px;animation:fadeUp .25s ease}
  .editor-empty-icon{font-size:44px;margin-bottom:14px}
  .editor-empty-text{color:var(--muted);font-size:14px}
  .editor-empty-sub{color:var(--faint);font-size:12px;margin-top:6px}

  .stmt-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:14px;transition:border-color .2s}
  .stmt-card:focus-within{border-color:var(--accent)}
  .stmt-level-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .level-badge{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;padding:3px 9px;border-radius:3px;background:var(--acc-bg);color:var(--accent);letter-spacing:.05em}
  .word-target{font-size:11px;color:var(--faint)}
  .guidance-link{font-size:11px;color:var(--sky);text-decoration:none;margin-left:auto}
  .guidance-link:hover{color:var(--accent2);text-decoration:underline}
  .tip-box{background:var(--sky-bg);border:1px solid var(--sky-border);border-radius:6px;padding:9px 12px;margin-bottom:10px;font-size:12px;color:var(--sky);line-height:1.55}
  textarea{width:100%;min-height:108px;background:var(--surface);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:10px 13px;resize:vertical;line-height:1.65;transition:border-color .15s}
  textarea:focus{outline:none;border-color:var(--accent)}
  textarea::placeholder{color:var(--faint)}
  .wc-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:5px;margin-bottom:3px}
  .wc-val{font-family:'DM Mono',monospace;font-weight:500}
  .wc-bar-track{background:var(--border);border-radius:3px;height:4px;overflow:hidden}
  .wc-bar-fill{height:100%;border-radius:3px;transition:width .15s,background .3s}

  /* ERRORS */
  .error-box{background:#fdf0f0;border:1px solid #e8b4b8;border-radius:8px;padding:12px 16px;margin-bottom:16px;animation:fadeUp .2s ease}
  .error-item{color:#c0392b;font-size:13px;margin-bottom:2px}
  .error-item::before{content:"⚠ "}

  /* SUMMARY */
  .summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
  .summary-cell{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 14px}
  .summary-cell-label{font-family:'DM Mono',monospace;font-size:10px;color:var(--faint);margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
  .summary-cell-val{font-size:13px;font-weight:600}

  #casestudy-ta{min-height:380px;font-size:14px;line-height:1.7}
  .cs-bar-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);margin-top:4px;font-family:'DM Mono',monospace}

  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-track{background:var(--surface)}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

  @media(max-width:860px){
    .r2-layout,.r3-layout{ grid-template-columns:1fr; }
    .sidebar,.r2-glossary,.r3-glossary{ position:static;height:auto;border:none;padding:0 14px 12px; }
    .r2-centre,.r3-centre{ padding:20px 14px 40px; }
    .summary-grid{grid-template-columns:1fr 1fr}
    header{padding:0 16px}
  }

  /* ── STATEMENT SECTION PANELS ── */
  .section-wc-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 18px;
  }

  .section-panel-header {
    margin-bottom: 4px;
  }

  /* stmt-card completed state */
  .stmt-card.stmt-done {
    border-color: var(--rics-border);
    background: var(--rics-bg);
    opacity: 0.85;
  }
  .stmt-card.stmt-done textarea {
    background: #f3f0f6;
    color: var(--muted);
    pointer-events: none;
  }

  /* Completed dot — uses rics purple */
  .dot.completed { background: var(--rics-bright); }

  /* Section toggle tabs */
  .section-tab { user-select: none; }
  .section-tab:hover { opacity: 0.85; }

  /* Sidebar wider for progress bars */

  /* Completed button */
  .btn-complete {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 7px 16px;
    border-radius: 7px;
    cursor: pointer;
    transition: all .15s;
    flex-shrink: 0;
    border: 1.5px solid var(--border2);
    background: var(--surface);
    color: var(--muted);
  }
  .btn-complete:hover {
    border-color: var(--rics-border);
    color: var(--rics);
    background: var(--rics-bg);
  }
  .btn-complete.is-done {
    background: var(--rics-bg);
    color: var(--rics);
    border-color: var(--rics-border);
    font-weight: 700;
  }

    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 999;

    color: var(--muted);

  /* ══════════════════════════════════════════════ CASE STUDY (STEP 4) ═════ */

  .cs-layout {
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 0;
    align-items: flex-start;
    min-height: calc(100vh - 116px);
  }
  .cs-main {
    padding: 28px 30px 80px;
    min-width: 0;
  }
  .cs-guidance {
    position: sticky;
    top: 58px;
    height: calc(100vh - 58px);
    overflow-y: auto;
    border-left: 1px solid var(--border);
    background: var(--surface);
    padding: 18px 16px 32px;
    scrollbar-width: thin;
    scrollbar-color: var(--rics-border) transparent;
  }

  /* Experience report cross-ref sidebar */
  .er-sidebar-ref-btn {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    border: 1px solid var(--cices-border);
    background: var(--cices-bg);
    color: var(--cices);
    cursor: pointer;
    transition: all .15s;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .er-sidebar-ref-btn:hover, .er-sidebar-ref-btn.referenced {
    background: var(--cices);
    color: #fff;
    border-color: var(--cices);
  }
  @media (max-width: 1100px) {
    .er-layout-3col { grid-template-columns: 180px 1fr !important; }
    .er-layout-3col .cs-guidance { display: none; }
  }
  @media (max-width: 800px) {
    .er-layout-3col { grid-template-columns: 1fr !important; }
    .er-layout-3col > div:first-child { display: none; }
  }

  /* Guidance panel sections */
  .cs-guide-title {
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--rics);
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rics-border);
  }
  .cs-guide-section {
    margin-bottom: 14px;
  }
  .cs-guide-section-title {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .11em;
    text-transform: uppercase;
    color: var(--rics-bright);
    margin-bottom: 5px;
  }
  .cs-guide-text {
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.65;
  }
  .cs-guide-text strong { color: var(--text); font-weight: 600; }
  .cs-guide-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 12px 0;
  }
  .cs-structure-item {
    display: flex;
    gap: 9px;
    margin-bottom: 8px;
    align-items: flex-start;
  }
  .cs-structure-num {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    background: var(--rics);
    border-radius: 50%;
    width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .cs-structure-body {}
  .cs-structure-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }
  .cs-structure-desc {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
  }

  /* Tip box */
  .cs-tip-box {
    background: var(--rics-bg);
    border: 1px solid var(--rics-border);
    border-left: 3px solid var(--rics);
    border-radius: 7px;
    padding: 11px 14px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 16px;
  }
  .cs-tip-box strong { color: var(--rics); }

  /* Warning box */
  .cs-warn-box {
    background: #fdf5e4;
    border: 1px solid #e0c97a;
    border-left: 3px solid #c8a830;
    border-radius: 7px;
    padding: 11px 14px;
    font-size: 12px;
    color: #7a5c10;
    line-height: 1.6;
    margin-bottom: 16px;
  }

  /* Appendix section */
  .cs-appendix-section {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .cs-appendix-title {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .cs-appendix-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
  }
  .cs-appendix-item {
    position: relative;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    width: 120px;
    cursor: default;
    transition: border-color .15s;
  }
  .cs-appendix-item:hover { border-color: var(--rics-bright); }
  .cs-appendix-thumb {
    width: 100%;
    height: 72px;
    object-fit: cover;
    border-radius: 5px;
    display: block;
    margin-bottom: 6px;
    background: var(--surface);
  }
  .cs-appendix-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    color: var(--rics-bright);
    margin-bottom: 1px;
  }
  .cs-appendix-name {
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cs-appendix-remove {
    position: absolute;
    top: 4px; right: 4px;
    width: 18px; height: 18px;
    background: rgba(200,50,50,.8);
    color: #fff;
    border: none;
    border-radius: 50%;
    font-size: 10px;
    line-height: 18px;
    text-align: center;
    cursor: pointer;
    display: none;
    padding: 0;
    font-family: monospace;
  }
  .cs-appendix-item:hover .cs-appendix-remove { display: block; }
  .cs-upload-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 16px;
    background: var(--surface);
    border: 1.5px dashed var(--border2);
    border-radius: 8px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    transition: all .15s;
    font-family: 'DM Sans', sans-serif;
  }
  .cs-upload-btn:hover {
    border-color: var(--rics-bright);
    color: var(--rics);
    background: var(--rics-bg);
  }

  /* Figure reference tag (inline in textarea area — shown as tooltip on hover) */
  .fig-ref-tag {
    display: inline-block;
    background: var(--rics-bg);
    border: 1px solid var(--rics-border);
    border-radius: 3px;
    padding: 1px 5px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--rics);
    cursor: help;
    position: relative;
  }

  /* Image hover preview tooltip */
  .fig-preview-tooltip {
    display: none;
    position: fixed;
    z-index: 9999;
    background: var(--card);
    border: 1.5px solid var(--rics-border);
    border-radius: 10px;
    padding: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,.18);
    pointer-events: none;
  }
  .fig-preview-tooltip img {
    max-width: 260px;
    max-height: 200px;
    display: block;
    border-radius: 6px;
  }
  .fig-preview-tooltip .fig-preview-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--rics-bright);
    margin-top: 6px;
    text-align: center;
  }

  /* Case study textarea styling */
  #casestudy-ta {
    min-height: 520px;
    font-size: 14px;
    line-height: 1.75;
  }

  @media(max-width:860px) {
    .cs-layout { grid-template-columns: 1fr; }
    .cs-guidance { position: static; height: auto; border: none; padding: 14px; }
    .cs-main { padding: 20px 14px 40px; }
  }


  /* Appendix item action buttons */
  .cs-appendix-actions {
    display: flex;
    gap: 4px;
    margin-top: 5px;
    justify-content: center;
    opacity: 0;
    transition: opacity .13s;
  }
  .cs-appendix-item:hover .cs-appendix-actions { opacity: 1; }
  .cs-appx-btn {
    flex: 1;
    padding: 3px 0;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--surface);
    font-size: 11px;
    cursor: pointer;
    transition: all .12s;
    color: var(--muted);
    font-family: monospace;
  }
  .cs-appx-btn:hover { background: var(--card); color: var(--text); border-color: var(--border2); }
  .cs-appx-open:hover   { color: var(--rics); border-color: var(--rics-border); background: var(--rics-bg); }
  .cs-appx-replace:hover{ color: #2e7d52; border-color: #a8d5b5; background: #f0faf4; }
  .cs-appx-del:hover    { color: #c0392b; border-color: #f0b4b4; background: #fdf0f0; }

  /* Thumbnail cursor hint */
  .cs-appendix-thumb { cursor: zoom-in; }

  /* Lightbox fade-in */
  @keyframes fadeIn { from { opacity:0 } to { opacity:1 } }

  /* Remove old single remove button (replaced by actions row) */
  .cs-appendix-remove { display: none !important; }


  /* ══════════════════════════════════════════════ AI INTEGRITY MODAL ══════ */
  .ai-modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 11000;
    background: rgba(0,0,0,.65);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn .2s ease;
    padding: 20px;
  }
  .ai-modal {
    background: var(--card);
    border: 1.5px solid var(--rics-border);
    border-top: 4px solid var(--rics);
    border-radius: 16px;
    max-width: 520px;
    width: 100%;
    padding: 32px 36px 28px;
    box-shadow: 0 24px 64px rgba(0,0,0,.28);
    animation: slideUp .22s ease;
  }
  .ai-modal.cices { border-color: #84B399; border-top-color: #2E4D3B; }
  .ai-modal.cices .ai-modal-badge { background:#EAF2ED; border-color:#84B399; color:#2E4D3B; }
  .ai-modal.cices .ai-modal-title { color:#2E4D3B; }
  .ai-modal.cices .ai-modal-body em { color:#2E4D3B; }
  .ai-modal.cices .ai-modal-understand { background:#2E4D3B; }
  @keyframes slideUp {
    from { opacity:0; transform:translateY(20px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .ai-modal-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: #fff0f0;
    border: 1px solid #f0b4b4;
    border-radius: 5px;
    padding: 4px 11px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #c0392b;
    margin-bottom: 14px;
  }
  .ai-modal-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 16px;
    line-height: 1.3;
  }
  .ai-modal-body {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.72;
    margin-bottom: 22px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .ai-modal-body strong { color: var(--text); font-weight: 600; }
  .ai-modal-body em { color: #c0392b; font-style: normal; font-weight: 600; }
  .ai-modal-footer {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 12px;
  }
  .ai-modal-understand {
    background: var(--rics);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 11px 28px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
    letter-spacing: .01em;
  }
  .ai-modal-understand:hover { opacity: .88; }


  /* ══════════════════════════════════════════════ HEADER BUTTONS ══════════ */
  .header-btns { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .header-btn  { padding:7px 12px !important; font-size:12px !important; }

  /* ══════════════════════════════════════════════ SECTION TABS (header) ════ */
  .section-tabs-bar {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 18px;
  }
  .stab {
    flex: 1;
    text-align: center;
    padding: 8px 6px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
    color: var(--muted);
    border: 1px solid transparent;
    font-family: 'DM Sans', sans-serif;
  }
  .stab:hover  { background: var(--card); color: var(--text); }
  .stab.active { background: var(--acc-bg); color: var(--accent); border-color: var(--acc-border); }
  .stab.stab-cpd.active    { background: var(--rics-bg);  color: var(--rics);   border-color: var(--rics-border); }
  .stab.stab-cs.active     { background: var(--rics-bg);  color: var(--rics);   border-color: var(--rics-border); }
  .stab.stab-cv.active     { background: var(--rics-bg);  color: var(--rics);   border-color: var(--rics-border); }
  /* CICES mode — override all stab active states with CICES palette */
  body.cices-mode .stab.active        { background: var(--cices-bg); color: var(--cices); border-color: var(--cices-border); }
  body.cices-mode .stab.stab-cpd.active { background: var(--cices-bg); color: var(--cices); border-color: var(--cices-border); }
  body.cices-mode .stab.stab-cs.active  { background: var(--cices-bg); color: var(--cices); border-color: var(--cices-border); }
  body.cices-mode .stab.stab-cv.active  { background: var(--cices-bg); color: var(--cices); border-color: var(--cices-border); }
  body.cices-mode .stab:hover           { background: var(--cices-bg); color: var(--cices); }
  .stab .stab-count { font-family:'DM Mono',monospace; font-size:10px; display:block; margin-top:1px; opacity:.7; }
  .stab.stab-locked { opacity:.38; cursor:not-allowed; pointer-events:none; }
  .stab.stab-locked .stab-count::before { content:"🔒 "; }
  body.cices-mode .step-item[data-step="2"] { display: none; }
  body.rpq-mode .stab.stab-locked { display: none !important; }
  body.rpq-mode .section-tabs-bar { justify-content: stretch; }
  body.rpq-mode .section-tabs-bar .stab { flex: 1; }
  .step-item.step-locked { color:var(--faint) !important; cursor:not-allowed !important; opacity:.38; border-bottom-color:transparent !important; }

  /* ══════════════════════════════════════════════ CPD LOGBOOK ═════════════ */
  .cpd-layout {
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 0;
    align-items: flex-start;
    min-height: calc(100vh - 116px);
  }
  .cpd-main { padding: 24px 28px 80px; min-width: 0; }
  .cpd-side {
    position: sticky;
    top: 58px;
    height: calc(100vh - 58px);
    overflow-y: auto;
    border-left: 1px solid var(--border);
    background: var(--surface);
    padding: 18px 16px 32px;
    scrollbar-width: thin;
  }

  /* ── CICES 3-column layout (cross-ref | main | guidance) ── */
  .cices-3col {
    display: grid;
    grid-template-columns: 200px 1fr 280px;
    gap: 0;
    align-items: flex-start;
    min-height: calc(100vh - 116px);
  }
  .cices-3col-ref {
    position: sticky;
    top: 58px;
    height: calc(100vh - 58px);
    overflow-y: auto;
    border-right: 1px solid var(--border);
    background: var(--surface);
    padding: 14px 12px 32px;
    scrollbar-width: thin;
    scrollbar-color: var(--cices-border) transparent;
  }
  .cices-3col-main { padding: 24px 28px 80px; min-width: 0; }
  .cices-3col-guide {
    position: sticky;
    top: 58px;
    height: calc(100vh - 58px);
    overflow-y: auto;
    border-left: 1px solid var(--border);
    background: var(--surface);
    padding: 18px 16px 32px;
    scrollbar-width: thin;
    scrollbar-color: var(--cices-border) transparent;
  }
  /* Competencies full-width (sidebar nav | main content | guidance) */
  .cices-comp-layout {
    display: grid;
    grid-template-columns: 200px 1fr 280px;
    gap: 0;
    align-items: flex-start;
    min-height: calc(100vh - 116px);
  }
  .cices-comp-nav {
    position: sticky;
    top: 58px;
    height: calc(100vh - 58px);
    overflow-y: auto;
    border-right: 1px solid var(--border);
    background: var(--surface);
    padding: 14px 10px 32px;
    scrollbar-width: thin;
    scrollbar-color: var(--cices-border) transparent;
  }
  .cices-comp-main { padding: 24px 24px 80px; min-width: 0; }
  .cices-comp-guide {
    position: sticky;
    top: 58px;
    height: calc(100vh - 58px);
    overflow-y: auto;
    border-left: 1px solid var(--border);
    background: var(--surface);
    padding: 18px 16px 32px;
    scrollbar-width: thin;
    scrollbar-color: var(--cices-border) transparent;
  }
  @media (max-width: 1200px) {
    .cices-3col     { grid-template-columns: 180px 1fr; }
    .cices-3col-guide { display: none; }
    .cices-comp-layout { grid-template-columns: 180px 1fr; }
    .cices-comp-guide  { display: none; }
  }
  @media (max-width: 820px) {
    .cices-3col     { grid-template-columns: 1fr; }
    .cices-3col-ref { display: none; }
    .cices-comp-layout { grid-template-columns: 1fr; }
    .cices-comp-nav    { display: none; }
  }

  /* CPD counter card */
  .cpd-counter-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 20px;
  }
  .cpd-counter-title {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 14px;
  }
  .cpd-bars { display: flex; flex-direction: column; gap: 10px; }
  .cpd-bar-row { display:flex; align-items:center; gap:10px; }
  .cpd-bar-label { font-size:12px; font-weight:600; color:var(--text); min-width:90px; }
  .cpd-bar-track { flex:1; height:8px; background:var(--border); border-radius:4px; overflow:hidden; position:relative; }
  .cpd-bar-fill  { height:100%; border-radius:4px; transition:width .4s ease; }
  .cpd-bar-val   { font-family:'DM Mono',monospace; font-size:11px; color:var(--muted); min-width:50px; text-align:right; }
  .cpd-ok-badge  { display:inline-flex;align-items:center;gap:5px;background:#e8f5e9;border:1px solid #a8d5b5;color:#2e7d52;border-radius:4px;padding:2px 8px;font-size:10px;font-weight:700;font-family:'DM Mono',monospace; }
  .cpd-warn-badge{ display:inline-flex;align-items:center;gap:5px;background:#fdf5e4;border:1px solid #e0c97a;color:#7a5c10;border-radius:4px;padding:2px 8px;font-size:10px;font-weight:700;font-family:'DM Mono',monospace; }

  /* CPD entry form */
  .cpd-form-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 16px;
    animation: fadeUp .2s ease;
  }
  .cpd-form-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 14px;
    font-family: 'Playfair Display', serif;
  }
  .cpd-form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .cpd-form-row { display:flex; flex-direction:column; gap:4px; }
  .cpd-form-row.full { grid-column: 1 / -1; }
  .cpd-form-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .cpd-input, .cpd-select, .cpd-textarea {
    padding: 8px 10px;
    border: 1.5px solid var(--border);
    border-radius: 7px;
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    transition: border-color .13s;
  }
  .cpd-input:focus, .cpd-select:focus, .cpd-textarea:focus {
    border-color: var(--accent);
    outline: none;
  }
  .cpd-textarea { min-height:80px; resize:vertical; }
  .cpd-char-count { font-size:10px; color:var(--faint); text-align:right; font-family:'DM Mono',monospace; }

  /* CPD entry list */
  .cpd-entry {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: flex-start;
    transition: border-color .13s;
  }
  .cpd-entry:hover { border-color: var(--border2); }
  .cpd-entry-title { font-size:13px; font-weight:600; color:var(--text); margin-bottom:4px; }
  .cpd-entry-meta  { display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
  .cpd-badge {
    font-family:'DM Mono',monospace; font-size:9px; font-weight:700;
    padding:2px 7px; border-radius:3px; letter-spacing:.04em;
  }
  .cpd-badge-structured  { background:var(--acc-bg);  color:var(--accent); border:1px solid var(--acc-border); }
  .cpd-badge-unstructured{ background:var(--surface);  color:var(--muted);  border:1px solid var(--border); }
  .cpd-badge-completed   { background:#e8f5e9; color:#2e7d52; border:1px solid #a8d5b5; }
  .cpd-badge-planned     { background:#fdf5e4; color:#7a5c10; border:1px solid #e0c97a; }
  .cpd-badge-rics        { background:var(--rics-bg); color:var(--rics); border:1px solid var(--rics-border); }
  .cpd-badge-hours       { background:var(--surface); color:var(--muted); border:1px solid var(--border); }
  .cpd-entry-actions { display:flex; gap:6px; }
  .cpd-action-btn {
    padding:5px 10px;

    gap: 5px;

    background: var(--card);

// Grade ordering A < K < E < B
const CICES_GRADE_ORDER = {A:0,K:1,E:2,B:3};

function cicesGradeKey(compId, actRef) { return compId + "_" + actRef; }

function setCicesGrade(compId, actRef, grade) {
  const key = cicesGradeKey(compId, actRef);
  if (S.cicesGrades[key] === grade) {
    delete S.cicesGrades[key]; // toggle off
  } else {
    S.cicesGrades[key] = grade;
  }
  saveState();
  render();
}

function cicesGradeMet(achieved, required) {
  if (!achieved) return false;
  return CICES_GRADE_ORDER[achieved] >= CICES_GRADE_ORDER[required];
}

function cicesCompProgress(allComps) {
  let total = 0, met = 0;
  allComps.forEach(comp => {
    comp.activities.forEach(act => {
      total++;
      const g = S.cicesGrades[cicesGradeKey(comp.id, act.ref)];
      if (g && cicesGradeMet(g, act.std)) met++;
    });
  });
  return {total, met};
}

function loadSeniorState() {
  try {
    const raw = localStorage.getItem(SENIOR_STORAGE_KEY);
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_SENIOR_STATE));
    const parsed = JSON.parse(raw);
    return Object.assign(JSON.parse(JSON.stringify(DEFAULT_SENIOR_STATE)), parsed);
  } catch (e) {
    return JSON.parse(JSON.stringify(DEFAULT_SENIOR_STATE));
  }
}

function saveState() {
  try {
    localStorage.setItem(SENIOR_STORAGE_KEY, JSON.stringify(S));
    const ind = document.getElementById("autosave-ind");
    if (ind) {
      ind.style.opacity = "1";

}

// Word counter helper
function cw(str) {
  if (!str) return 0;
  return str.trim().split(/\s+/).filter(Boolean).length;
}

function esc(s) {
  return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function xmlEsc(s) {
  return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&apos;");
}

// ── Stepbar sync ─────────────────────────────────────────────────────────────
function updateStepbar() {
  document.querySelectorAll(".step-item[data-step]").forEach(el => {
    const s = parseInt(el.dataset.step, 10);
    const isCurrent = s === S.step;
    const isDone = s < S.step;
    el.className = "step-item" + (isCurrent ? " active" : isDone ? " done" : "");
    el.onclick = isDone ? () => goStep(s) : null;
  });
}

// ── Competency helper lookups ────────────────────────────────────────────────
function getSeniorPathwayComps() {
  const sectorKey = S.sel.cicesSector;
  const coreKey = S.sel.cicesCore;
  const spKey = S.sel.cicesSpecialism;

  if (!sectorKey || !CICES_SECTORS[sectorKey]) {
    return { coreComps: [], specComps: [], coreLabel: "", specLabel: "" };
  }
  const sector = CICES_SECTORS[sectorKey];
  const activeCoreKey = coreKey || (Object.keys(sector.cores).length === 1 ? Object.keys(sector.cores)[0] : null);

  const coreDef = activeCoreKey && sector.cores[activeCoreKey] ? sector.cores[activeCoreKey] : null;
  const coreComps = coreDef ? coreDef.comps : [];
  const coreLabel = coreDef ? coreDef.label : "Core Competencies";

  const specDef = spKey && sector.specialisms[spKey] ? sector.specialisms[spKey] : null;
  const specComps = specDef ? specDef.comps : [];
  const specLabel = specDef ? specDef.label : "Specialist Competencies";

  return { coreComps, specComps, coreLabel, specLabel };
}

function getSeniorValidation() {
  const { coreComps, specComps } = getSeniorPathwayComps();
  const selected = S.selectedComps || [];
  const coreCount = selected.filter(id => coreComps.some(c => c.id === id)).length;
  const specCount = selected.filter(id => specComps.some(c => c.id === id)).length;
  const total = selected.length;
  const isValid = total === 6 && coreCount >= 2 && specCount >= 2;

  let message = "";
  if (total < 6) {
    message = "Select " + (6 - total) + " more competency" + (6 - total > 1 ? "ies" : "") + " (minimum 2 Core and 2 Specialist required).";
  } else if (coreCount < 2) {
    message = "You have selected " + coreCount + " Core competency. Minimum 2 Core competencies required. Please deselect a specialist competency and select a core competency.";
  } else if (specCount < 2) {
    message = "You have selected " + specCount + " Specialist competency. Minimum 2 Specialist competencies required. Please deselect a core competency and select a specialist competency.";
  } else {
    message = "✅ Criteria Met! Exactly 6 competencies selected: " + coreCount + " Core and " + specCount + " Specialist.";
  }

  return { total, coreCount, specCount, isValid, message };
}

function toggleSeniorComp(id) {
  if (!S.selectedComps) S.selectedComps = [];
  const idx = S.selectedComps.indexOf(id);
  if (idx !== -1) {
    S.selectedComps.splice(idx, 1);
  } else {
    if (S.selectedComps.length >= 6) {
      alert("You have already selected 6 competencies. To choose a different competency, please deselect one first.");
      return;
    }
    S.selectedComps.push(id);
    if (!S.compLevels[id]) S.compLevels[id] = 3; // Senior default level 3
  }
  saveState();
  render();
}

function setSeniorCompLevel(id, lvl) {
  S.compLevels[id] = lvl;
  saveState();
  render();
}

function setSeniorTab(tab) {

function countCompletedNarratives() {
  if (!S.selectedComps) return 0;
  return S.selectedComps.filter(id => {
    const w = cw(S.narratives[id] || "");
    return w >= 200;
  }).length;
}

// ── Tab 1: Narratives Builder (With Real-Time Word Counting) ──────────────────
function buildSeniorNarrativesHtml() {
  const { coreComps, specComps } = getSeniorPathwayComps();
  const allPathwayComps = [...coreComps, ...specComps];
  const selectedComps = S.selectedComps || [];

  if (!S.activeCompId || !selectedComps.includes(S.activeCompId)) {
    S.activeCompId = selectedComps[0] || null;
  }

  const activeComp = allPathwayComps.find(c => c.id === S.activeCompId) || { id: S.activeCompId, name: "Selected Competency" };
  const isCore = coreComps.some(c => c.id === activeComp.id);
  const curNarrative = S.narratives[activeComp.id] || "";
  const words = cw(curNarrative);

  // Word count evaluation: 200 - 250 words advisory
  const isOptimal = words >= 200 && words <= 250;
  const isTooShort = words < 200;
  const statusColor = isOptimal ? "#2e7d52" : isTooShort ? "#84B399" : "#2E4D3B";

  let statusBadge = '';
  if (isOptimal) {
    statusBadge = '<span class="badge" style="background:#2e7d52;color:#fff;">✓ Advisory Met (200–250 words)</span>';
  } else if (isTooShort) {
    statusBadge = `<span class="badge" style="background:#fef3c7;color:#92400e;">${200 - words} words to minimum advisory (200w)</span>`;
  } else {
    statusBadge = `<span class="badge" style="background:#e4ede8;color:#2E4D3B;">${words} words (Advisory fulfilled — keep concise)</span>`;
  }

  let html = `
  <div style="display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start;">
    <!-- Left Navigation: 6 Selected Competencies -->
    <div style="background:#ffffff;border:1px solid #cdd8e0;border-radius:12px;padding:16px;">
      <div style="font-size:11px;font-family:'DM Mono',monospace;text-transform:uppercase;color:#2E4D3B;font-weight:700;margin-bottom:10px;">
        Your 6 Selected Competencies
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;">
  `;

  selectedComps.forEach((id, i) => {
    const comp = allPathwayComps.find(c => c.id === id) || { id, name: id };
    const compIsCore = coreComps.some(c => c.id === id);
    const nWords = cw(S.narratives[id] || "");
    const isAct = id === S.activeCompId;
    const isDone = nWords >= 200;

    html += `
      <div onclick="selectActiveSeniorComp('${id}')" style="padding:12px 14px;border-radius:8px;border:1.5px solid ${isAct ? '#2E4D3B' : '#e2e8f0'};background:${isAct ? '#f0f7f4' : '#fff'};cursor:pointer;transition:all .15s ease;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
          <span style="font-family:'DM Mono',monospace;font-size:11px;font-weight:700;color:${compIsCore ? '#2E4D3B' : '#4a7a61'};">
            #${i+1} ${id} (${compIsCore ? 'Core' : 'Spec'})
          </span>
          <span id="narrative-side-wc-${id}" style="font-size:10px;font-family:'DM Mono',monospace;color:${isDone ? '#2e7d52' : '#84B399'};font-weight:600;">
            ${isDone ? '✓ ' + nWords + 'w' : nWords + 'w'}
          </span>
        </div>
        <div style="font-size:13px;font-weight:600;color:#1e2530;line-height:1.3;">${comp.name}</div>
      </div>`;
  });

  html += `
      </div>
    </div>

    <!-- Right Editor: Narrative Drafting -->
    <div style="background:#ffffff;border:1px solid #cdd8e0;border-radius:12px;padding:24px;">
      <!-- Competency Header -->
      <div style="border-bottom:1px solid #e2e8f0;padding-bottom:16px;margin-bottom:18px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
          <span style="font-family:'DM Mono',monospace;font-size:12px;font-weight:700;color:#fff;background:#2E4D3B;padding:3px 8px;border-radius:4px;">
            ${activeComp.id} (${isCore ? 'Core' : 'Specialist'})
          </span>
          <span style="font-size:12px;color:#64748b;">Target Grade: Member (Senior Applicant Route)</span>
        </div>
        <h3 style="font-size:20px;font-weight:700;color:#1e2530;margin:0 0 8px 0;">${activeComp.name}</h3>
        ${activeComp.activities ? `
          <div style="background:#f8fafc;border-left:3px solid #84B399;padding:8px 12px;font-size:12px;color:#475569;line-height:1.5;">
            <strong>Competency Scope:</strong> ${activeComp.activities.map(a => a.desc).slice(0, 3).join(" · ")}
          </div>
        ` : ''}
      </div>

      <!-- Narrative Guidance Callout -->
      <div style="background:#f0f7f4;border:1px solid #84B399;border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:12px;line-height:1.5;color:#2E4D3B;">
        💡 <strong>CICES Narrative Advisory (200–250 words):</strong> Describe <em>how, when, and where</em> you fulfilled this competency in your career. Link your technical and managerial leadership directly to your detailed CV.
      </div>

      <!-- Live Word Count & Progress Bar -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <span id="narrative-wc-val" style="font-family:'DM Mono',monospace;font-size:13px;font-weight:700;color:${statusColor};">
            ${words} / 200–250 words
          </span>
          <span id="narrative-wc-badge">${statusBadge}</span>
        </div>
        <button class="btn btn-ghost" onclick="insertSeniorNarrativeTemplate('${activeComp.id}')" style="font-size:11px;padding:2px 8px;border-color:#84B399;color:#2E4D3B;">
          + Insert Starter Structure
        </button>
      </div>

      <div style="background:#e2e8f0;height:6px;border-radius:3px;margin-bottom:14px;overflow:hidden;">
        <div id="narrative-wc-bar" style="height:6px;border-radius:3px;background:${statusColor};width:${Math.min((words/250)*100, 100)}%;transition:width .15s ease;"></div>
      </div>

      <textarea id="senior-narrative-textarea" oninput="updateSeniorNarrative(this.value)" placeholder="Write your 200–250 word narrative for ${activeComp.id} here. Describe how, when, and where your experience satisfies this requirement..." style="width:100%;height:320px;padding:16px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;line-height:1.6;font-family:inherit;resize:vertical;outline:none;transition:border-color .15s;">${curNarrative}</textarea>
    </div>
  </div>`;

  return html;
}

function selectActiveSeniorComp(id) {
  S.activeCompId = id;
  saveState();
  render();
}

// REAL-TIME NARRATIVE WORD COUNT HANDLER (NO FOCUS LOSS)
function updateSeniorNarrative(val) {
  if (!S.narratives) S.narratives = {};
  if (!S.activeCompId) return;
  S.narratives[S.activeCompId] = val;
  saveState();

  const words = cw(val);
  const wcEl = document.getElementById("narrative-wc-val");
  const barEl = document.getElementById("narrative-wc-bar");
  const badgeEl = document.getElementById("narrative-wc-badge");
  const sideItemEl = document.getElementById("narrative-side-wc-" + S.activeCompId);
  const topTabCounterEl = document.getElementById("narrative-tab-counter");

  const isOptimal = words >= 200 && words <= 250;
  const isTooShort = words < 200;
  const statusColor = isOptimal ? "#2e7d52" : isTooShort ? "#84B399" : "#2E4D3B";

  if (wcEl) {
    wcEl.textContent = words + " / 200–250 words";
    wcEl.style.color = statusColor;
  }
  if (barEl) {
    const pct = Math.min((words / 250) * 100, 100);
    barEl.style.width = pct + "%";
    barEl.style.background = statusColor;
  }
  if (badgeEl) {
    if (isOptimal) {
      badgeEl.innerHTML = '<span class="badge" style="background:#2e7d52;color:#fff;">✓ Advisory Met (200–250 words)</span>';
    } else if (isTooShort) {
      badgeEl.innerHTML = '<span class="badge" style="background:#fef3c7;color:#92400e;">' + (200 - words) + ' words to minimum advisory (200w)</span>';
    } else {
      badgeEl.innerHTML = '<span class="badge" style="background:#e4ede8;color:#2E4D3B;">' + words + ' words (Advisory fulfilled — keep concise)</span>';
    }
  }
  if (sideItemEl) {
    sideItemEl.innerHTML = words >= 200 ? '✓ ' + words + 'w' : words + 'w';
    sideItemEl.style.color = words >= 200 ? '#2e7d52' : '#84B399';
  }
  if (topTabCounterEl) {
    topTabCounterEl.textContent = countCompletedNarratives() + ' / 6';
  }
}

function insertSeniorNarrativeTemplate(id) {
  const ta = document.getElementById("senior-narrative-textarea");
  if (!ta) return;
  const template = "In my role as [Job Title] at [Company/Project] from [Year] to [Year], I fulfilled the requirements of " + id + " through…\n\nSpecifically, when [describe specific scenario or milestone], I was responsible for…\n\nI ensured compliance by [how standards/regulations were applied], leading the project team to…";
  if (!ta.value.trim() || confirm("Replace current draft with template?")) {
    ta.value = template;
    updateSeniorNarrative(template);
  }
}

function updateSeniorCV(val) {
  S.detailedCV = val;
  saveState();

  const words = cw(val);
  const wcEl = document.getElementById("cv-wc-val");
  const barEl = document.getElementById("cv-wc-bar");
  const badgeEl = document.getElementById("cv-wc-badge");

  const isMet = words >= 1500;
  const col = isMet ? "#2e7d52" : words >= 1000 ? "#b5651d" : "#2E4D3B";

  if (wcEl) {
    wcEl.textContent = words.toLocaleString() + " / 1,500 – 2,000 words";
    wcEl.style.color = col;
  }
  if (barEl) {
    barEl.style.width = Math.min((words / 2000) * 100, 100) + "%";
    barEl.style.background = col;
  }
  if (badgeEl) {
    badgeEl.textContent = isMet ? "✓ Minimum 1,500 words reached" : (1500 - words) + " words to minimum";
    badgeEl.style.background = isMet ? "#2e7d52" : "#fef3c7";
    badgeEl.style.color = isMet ? "#fff" : "#92400e";
  }
}

function seniorCpdDownloadCSV() {
  const rows = [
    ["CHARTERED INSTITUTION OF CIVIL ENGINEERING SURVEYORS"],
    ["Continuing Professional Development Record — Senior Applicant Route"],
    [],
    ["CPD Plan"],
    ["Learning / Topic", "Classification", "Objective", "Start Date", "Time Scale"],
    ...(S.cpdPlan || []).map(p => [p.learning || "", p.type || "", p.objective || "", p.startDate || "", p.timeScale || ""]),
    [],
    ["CPD Activity Log"],
    ["Date", "Duration / Points", "Activity Title", "Classification", "Outcomes & Benefits"],
    ...(S.cpd || []).map(e => [e.startDate || "", e.cpdPoints || "", e.title || "", e.activityType || "", e.outcome || ""])
  ];

  const csv = rows.map(r => r.map(c => {
    const s = String(c || "");
    return (s.includes(",") || s.includes("\n") || s.includes('"')) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(",")).join("\r\n");

  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = "CICES_Senior_CPD_Record.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

function seniorCpdUploadCSV(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const lines = e.target.result.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const imported = [];
    lines.forEach(l => {
      const parts = l.split(",");
      if (parts.length >= 3 && parts[0].includes("-")) {
        imported.push({
          id: "cpd_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4),
          startDate: parts[0].replace(/"/g, ""),
          cpdPoints: parts[1] ? parts[1].replace(/"/g, "") : "1 day (5 pts)",
          title: parts[2] ? parts[2].replace(/"/g, "") : "CPD Event",
          activityType: parts[3] ? parts[3].replace(/"/g, "") : "Course / Seminar / Conference",
          outcome: parts[4] ? parts[4].replace(/"/g, "") : ""
        });
      }
    });
    if (imported.length > 0) {
      S.cpd = (S.cpd || []).concat(imported);
      saveState();
      render();
      alert("Successfully imported " + imported.length + " CPD entries.");
    } else {
      alert("No valid date-prefixed CPD entries found in CSV.");
    }
  };
  reader.readAsText(file, "utf-8");
  input.value = "";
}

// 1. Genuine OpenXML (.docx) Generator
function exportSeniorWordDocx() {
  const { coreComps, specComps, coreLabel, specLabel } = getSeniorPathwayComps();
  const allComps = [...coreComps, ...specComps];
  const date = new Date().toLocaleDateString("en-GB");
  const ps = [];

  const CT  = "0C3512";   // CICES deep forest green
  const CML = "C0DACC";   // CICES mint/sage shade
  const CBR = "2E4D3B";   // CICES border green
  const CBT = "404040";   // body text

  const x = xmlEsc;

  const para = (runs, pPrXml="") =>
    `<w:p>${pPrXml ? `<w:pPr>${pPrXml}</w:pPr>` : ""}${runs}</w:p>`;

  const run = (text, rPrXml="") =>
    text === "" ? "" :
    `<w:r>${rPrXml ? `<w:rPr>${rPrXml}</w:rPr>` : ""}<w:t xml:space="preserve">${x(text)}</w:t></w:r>`;

  const spacing = (before, after) =>
    `<w:spacing w:before="${before}" w:after="${after}"/>`;

  const addPageBreak = () => ps.push(`<w:p><w:r><w:br w:type="page"/></w:r></w:p>`);

  const addH1 = (t) => ps.push(
    `<w:p><w:pPr><w:shd w:val="clear" w:color="auto" w:fill="${CT}"/>${spacing(280,100)}</w:pPr>` +
    run(t, `<w:color w:val="FFFFFF"/><w:b/><w:sz w:val="28"/><w:szCs w:val="28"/>`) +
    `</w:p>`
  );

  const addH2 = (t) => ps.push(
    `<w:p><w:pPr><w:shd w:val="clear" w:color="auto" w:fill="${CML}"/>${spacing(200,60)}</w:pPr>` +
    run(t, `<w:color w:val="${CT}"/><w:b/><w:sz w:val="24"/><w:szCs w:val="24"/>`) +
    `</w:p>`
  );

  const addPara = (t, indentLeft=0) => {
    const lines = (t || "").split("\n");
    lines.forEach(line => {
      ps.push(para(
        run(line || " ", `<w:sz w:val="22"/><w:szCs w:val="22"/><w:color w:val="${CBT}"/>`),
        `${spacing(0,80)}${indentLeft ? `<w:ind w:left="${indentLeft}"/>` : ""}`
      ));
    });
  };

  const addBlank = () => ps.push(para(run(" ", `<w:sz w:val="14"/>`), spacing(0,0)));

  const cRow = (lbl, val) =>
    `<w:tr>` +
    `<w:tc><w:tcPr><w:tcW w:w="2800" w:type="dxa"/><w:shd w:val="clear" w:color="auto" w:fill="${CML}"/><w:tcBorders><w:top w:val="single" w:sz="4" w:color="${CBR}"/><w:left w:val="single" w:sz="4" w:color="${CBR}"/><w:bottom w:val="single" w:sz="4" w:color="${CBR}"/><w:right w:val="single" w:sz="4" w:color="${CBR}"/></w:tcBorders></w:tcPr>` +
    `<w:p><w:pPr>${spacing(60,60)}</w:pPr><w:r><w:rPr><w:b/><w:sz w:val="20"/><w:szCs w:val="20"/></w:rPr><w:t xml:space="preserve">${x(lbl)}</w:t></w:r></w:p></w:tc>` +
    `<w:tc><w:tcPr><w:tcW w:w="6500" w:type="dxa"/><w:shd w:val="clear" w:color="auto" w:fill="FFFFFF"/><w:tcBorders><w:top w:val="single" w:sz="4" w:color="${CBR}"/><w:left w:val="single" w:sz="4" w:color="${CBR}"/><w:bottom w:val="single" w:sz="4" w:color="${CBR}"/><w:right w:val="single" w:sz="4" w:color="${CBR}"/></w:tcBorders></w:tcPr>` +
    `<w:p><w:pPr>${spacing(60,60)}</w:pPr><w:r><w:rPr><w:sz w:val="20"/><w:szCs w:val="20"/></w:rPr><w:t xml:space="preserve">${x(val)}</w:t></w:r></w:p></w:tc>` +
    `</w:tr>`;

  const cTable = (rows) =>
    `<w:tbl><w:tblPr><w:tblStyle w:val="TableGrid"/><w:tblW w:w="9300" w:type="dxa"/><w:tblBorders><w:insideH w:val="single" w:sz="4" w:color="${CBR}"/><w:insideV w:val="single" w:sz="4" w:color="${CBR}"/></w:tblBorders></w:tblPr>${rows}</w:tbl>`;

  // ── COVER PAGE ──
  ps.push(
    `<w:p><w:pPr><w:shd w:val="clear" w:color="auto" w:fill="${CT}"/>${spacing(360,80)}</w:pPr>` +
    run("CICES MEMBER (SENIOR APPLICANT ROUTE)", `<w:color w:val="FFFFFF"/><w:b/><w:sz w:val="48"/><w:szCs w:val="48"/>`) +
    `</w:p>`
  );
  ps.push(
    `<w:p><w:pPr><w:shd w:val="clear" w:color="auto" w:fill="${CT}"/>${spacing(0,360)}</w:pPr>` +
    run("Executive Portfolio Submission", `<w:color w:val="${CML}"/><w:sz w:val="28"/><w:szCs w:val="28"/>`) +

  addBlank();

  const sector = S.sel?.cicesSector ? CICES_SECTORS[S.sel.cicesSector] : null;
  ps.push(cTable([
    cRow("Target Grade", "Member — MCInstCES (Senior Applicant Route)"),

  addBlank();

  // Declaration box
  ps.push(
    `<w:p><w:pPr><w:pBdr><w:left w:val="single" w:sz="12" w:color="${CBR}"/></w:pBdr><w:shd w:val="clear" w:color="auto" w:fill="${CML}"/>${spacing(120,60)}</w:pPr>` +

  addPageBreak();

  // ── SECTION 1: 6 COMPETENCY NARRATIVES ──

  addBlank();

  (S.selectedComps || []).forEach((id, idx) => {
    const comp = allComps.find(c => c.id === id) || { id, name: id };
    const isCore = coreComps.some(c => c.id === id);
    const nText = S.narratives[id] || "";
    const nWords = cw(nText);

    addH2(`#${idx + 1} ${comp.id}: ${comp.name} (${isCore ? 'Core' : 'Specialist'}) — Target Level 3`);
    ps.push(para(run(`Advisory: 200–250 words | Actual: ${nWords} words`, `<w:sz w:val="18"/><w:i/><w:color w:val="${nWords >= 200 ? '2e7d52' : 'b5651d'}"/>`), spacing(40, 80)));
    if (nText.trim()) {
      addPara(nText, 240);
    } else {
      ps.push(para(run("[Narrative not yet written]", `<w:sz w:val="20"/><w:color w:val="AAAAAA"/><w:i/>`), `<w:ind w:left="240"/>${spacing(0,80)}`));
    }
    addBlank();
  });
  addPageBreak();

  // ── SECTION 2: DETAILED CV ──
  addH1("Section 2 — Detailed CV (Whole Career Description)");
  addPara("A whole career description (1,500–2,000 words advisory target) covering education, qualifications gained, employment history, and explanation of any non-surveying periods or gaps.");
  addBlank();

  // Employment Table
  if ((S.cv || []).length > 0) {
    addH2("Employment History Timeline");
    (S.cv || []).forEach(e => {
      ps.push(
        `<w:p><w:pPr><w:pBdr><w:left w:val="single" w:sz="12" w:color="${CBR}"/></w:pBdr><w:shd w:val="clear" w:color="auto" w:fill="${CML}"/>${spacing(100,40)}</w:pPr>` +
        run(`${e.position} at ${e.employer} (${e.dateFrom} – ${e.dateTo || 'Present'})`, `<w:b/><w:sz w:val="22"/><w:color w:val="${CT}"/>`) +
        `</w:p>`
      );
      if (e.overview) addPara(e.overview, 240);
      addBlank();
    });
  }

  addH2("Whole Career Narrative");
  if (S.detailedCV && S.detailedCV.trim()) {
    addPara(S.detailedCV);
  } else {
    ps.push(para(run("[Detailed CV narrative not yet completed]", `<w:sz w:val="20"/><w:color w:val="AAAAAA"/><w:i/>`)));
  }
  addPageBreak();

  // ── SECTION 3: 2-YEAR CONTINUING PROFESSIONAL DEVELOPMENT ──
  addH1("Section 3 — Continuing Professional Development (CPD Record)");
  addPara("Records of continuing professional development undertaken over the last two years in line with CICES template requirements.");
  addBlank();

  if ((S.cpdPlan || []).length > 0) {
    addH2("CPD Plan (Learning Objectives)");
    (S.cpdPlan || []).forEach(p => {
      ps.push(cTable([
        cRow("Topic / Learning", p.learning),
        cRow("Classification", p.type || "—"),
        cRow("Objective", p.objective || "—"),
        cRow("Start Date & Time Scale", (p.startDate || "") + (p.timeScale ? " (" + p.timeScale + ")" : ""))
      ].join("")));
      addBlank();
    });
  }

  addH2("CPD Activity Log (Past 24 Months)");
  if ((S.cpd || []).length > 0) {
    (S.cpd || []).forEach(e => {
      ps.push(cTable([
        cRow("Date", e.startDate),
        cRow("Duration / CPD Points", e.cpdPoints || "—"),
        cRow("Activity Description", e.title || "—"),
        cRow("Classification / Type", e.activityType || "—"),
        cRow("Learning & Outcomes", e.outcome || "—")
      ].join("")));
      addBlank();
    });
  } else {
    ps.push(para(run("[No CPD activities recorded]", `<w:sz w:val="20"/><w:color w:val="AAAAAA"/><w:i/>`)));
  }

  // ── Assemble OpenXML Package ──
  const bodyXml = ps.join("\n");
  const docXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:body>
${bodyXml}
<w:sectPr>
  <w:pgSz w:w="11906" w:h="16838"/>
  <w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1701" w:header="709" w:footer="709"/>
</w:sectPr>
</w:body>
</w:document>`;

  const stylesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:docDefaults>
    <w:rPrDefault><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial"/><w:sz w:val="22"/><w:lang w:val="en-GB"/></w:rPr></w:rDefault>
  </w:docDefaults>
  <w:style w:type="paragraph" w:default="1" w:styleId="Normal">
    <w:name w:val="Normal"/><w:pPr><w:spacing w:after="120"/></w:pPr>
  </w:style>
  <w:style w:type="table" w:styleId="TableGrid">
    <w:name w:val="Table Grid"/>
    <w:tblPr><w:tblBorders>
      <w:top w:val="single" w:sz="4" w:color="2E4D3B"/>
      <w:left w:val="single" w:sz="4" w:color="2E4D3B"/>
      <w:bottom w:val="single" w:sz="4" w:color="2E4D3B"/>
      <w:right w:val="single" w:sz="4" w:color="2E4D3B"/>
      <w:insideH w:val="single" w:sz="4" w:color="2E4D3B"/>
      <w:insideV w:val="single" w:sz="4" w:color="2E4D3B"/>
    </w:tblBorders></w:tblPr>
  </w:style>
</w:styles>`;

  const relXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

  const wordRelXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`;

  const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">

  <Default Extension="xml" ContentType="application/xml"/>

  <Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
</Types>`;

  // Download via JSZip

    s.onerror = () => exportSeniorWordHtml(); // Fallback to .doc if CDN unavailable
    document.head.appendChild(s);
  } else {
    buildAndSaveZip(docXml, relXml, wordRelXml, stylesXml, contentTypes);
  }
}

function buildAndSaveZip(docXml, relXml, wordRelXml, stylesXml, contentTypes) {
  const zip = new JSZip();
  zip.file("[Content_Types].xml", contentTypes);
  zip.folder("_rels").file(".rels", relXml);
  const wordFolder = zip.folder("word");
  wordFolder.file("document.xml", docXml);
  wordFolder.file("styles.xml", stylesXml);
  wordFolder.folder("_rels").file("document.xml.rels", wordRelXml);

  zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" })
    .then(blob => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "CICES_Senior_Applicant_Submission.docx";
      a.click();
      URL.revokeObjectURL(a.href);
    })
    .catch(err => {
      console.error("Zip error:", err);
      exportSeniorWordHtml();
    });
}

// ══════════════════════════════════════════════════════════════════════════════
// MAIN DISPATCHER
// ══════════════════════════════════════════════════════════════════════════════
function render() {
  try {
    updateStepbar();
    const main = document.getElementById("main");
    if (!main) return;
    main.innerHTML = "";

    switch (S.step) {
      case 1: r1Senior(main); break;
      case 2: r2Senior(main); break;
      case 3: r3Senior(main); break;
      case 4: rSubmissionSenior(main); break;
      case 5: rSubmissionSenior(main); break;
      default: r1Senior(main);
    }
  } catch (err) {
    console.error("render() error:", err);
  }
}

document.addEventListener("DOMContentLoaded", function() {
  render();
});
